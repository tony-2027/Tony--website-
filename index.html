<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tony Website</title>

<style>
body {
  background-color: #ffe6f0;

  text-align: center;
  margin: 0;

.navbar {
  background-color: #ff4d6d;
  padding: 15px;
}

.navbar a {
  color: white;
  margin: 15px;
  text-decoration: none;
  font-weight: bold;
}

.navbar a:hover {
  text-decoration: underline;
}

.gallery {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}

.card {
  width: 150px;
  height: 150px;
  background-color: white;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  transition: transform 0.3s ease;
}

.card:hover {
  transform: scale(1.1);
}

@media (max-width: 600px) {
  .gallery {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>
