<style>
body {
  background-color: #ffe6f0;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
}

.navbar {
  background-color: #ff4d6d;
  padding: 15px;
}

.navbar a {
  color: white;
  margin: 15px;
  text-decoration: none;
  font-weight: bold;
}

.navbar a:hover {
  text-decoration: underline;
}

.gallery {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
  animation: fadeIn 1.2s ease-in;
}

.card {
  width: 150px;
  height: 150px;
  background-color: white;
  border-radius: 15px;
  overflow: hidden;
  transition: transform 0.3s ease;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card:hover {
  transform: scale(1.1);
}

.card:active {
  transform: scale(0.95);
  background-color: pink;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 600px) {
  .gallery {
    flex-direction: column;
    align-items: center;
  }
}
</style>
