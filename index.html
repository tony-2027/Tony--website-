<!DOCTYPE html>
<html>
<head>
    <title>Tony Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 20px;
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-size: 32px;
        }

        p {
            font-size: 18px;
        }

        .section {
            padding: 30px 20px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            margin: 20px;
            border-radius: 15px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: white;
            color: #333;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            padding: 15px;
            font-size: 14px;
            background: rgba(0,0,0,0.2);
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to Tony's Website 🚀</h1>
    <p>Created using mobile & GitHub Pages</p>
</header>

<div class="section">
    <div class="card">
        <h2>About Me</h2>
        <p>Hi, I'm Tony. I'm learning web development and building websites.</p>
    </div>

    <div class="card">
        <h2>Contact</h2>
        <p>Email: tony@email.com</p>
        <a href="#" class="btn">Message Me</a>
    </div>
</div>

<footer>
    © 2026 Tony | All Rights Reserved
</footer>

</body>
</html>
