<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tony Website</title>

<style>

body {
  background-color: #ffe6f0;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
}

.navbar {
  background-color: #ff4d6d;
  padding: 15px;
}

.navbar a {
  color: white;
  margin: 15px;
  text-decoration: none;
  font-weight: bold;
}

.products {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
}

/* PRODUCT CARD */
.product {
  background: white;
  padding: 10px;
  border-radius: 10px;
  width: 200px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.2);
  transition: 0.3s;
}

.product img {
  width: 100%;
  border-radius: 10px;
}

.product:hover {
  transform: scale(1.05);
}

/* BUTTON */
.buy-btn {
  background-color: #ff4d6d;
  color: white;
  border: none;
  padding: 8px 15px;
  border-radius: 6px;
  margin-top: 8px;
  cursor: pointer;
}

.buy-btn:hover {
  background-color: #e03e5d;
}

/* MOBILE */
@media (max-width: 600px) {
  .products {
    flex-direction: column;
    align-items: center;
  }
}

</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</div>

<h2>My Dress Collection</h2>

<div class="products">

  <div class="product">
    <img src="https://picsum.photos/300?random=1">
    <h3>Summer Dress</h3>
    <p>Price: ₹1200</p>
    <a href="https://wa.me/91XXXXXXXXXX?text=I want to buy Summer Dress for ₹1200" target="_blank">
  <button class="buy-btn">Buy Now</button>
    </a>
  </div>

  <div class="product">
    <img src="https://picsum.photos/300?random=2">
    <h3>Party Dress</h3>
    <p>Price: ₹1800</p>
    <a href="https://wa.me/91XXXXXXXXXX?text=I want to buy Summer Dress for ₹1200" target="_blank">
  <button class="buy-btn">Buy Now</button>
    </a>
  </div>

</div>

</body>
</html>
